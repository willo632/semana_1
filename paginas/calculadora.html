<!DOCTYPE html>
<html lang="en">
<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Calculadora</title>
		<link href="../css/bootstrap.min.css" rel="stylesheet">
        <script src="../js/scritp.js"></script>
</head>
<body>
<header>
 <nav class="navbar navbar-expand-lg navbar-light bg-light">
	<a class="navbar-brand" href="../index.html">Menú Principal</a>
	<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
		<span class="navbar-toggler-icon"></span>
	</button>
	<div class="collapse navbar-collapse" id="navbarNav">
		<ul class="navbar-nav">
			<li class="nav-item">
				<a class="nav-link" href="./personal.html">Personal</a>

			<li class="nav-item active">

			</li>

 </nav>
</header>
<div class="container py-5">
		<div class="row">
				<div class="col-md-12">
						<h1>Calculadora</h1>
				</div>
            <div class="card shadow p-4 col-md-6">
            <h2 class="text-danger">Calculadora</h2>

            <input type="number" id="num1" class="form-control mb-3" placeholder="Número 1">

            <input type="number" id="num2" class="form-control mb-3" placeholder="Número 2">

            <div class="d-flex gap-2">
                <button class="btn btn-primary" onclick="sumar()">+</button>

                <button class="btn btn-warning" onclick="restar()">-</button>

                <button class="btn btn-success" onclick="multiplicar()">×</button>

                <button class="btn btn-danger" onclick="dividir()">÷</button>
            </div>

            <h3 class="mt-4">
                Resultado:
                <span id="resultado">0</span>
            </h3>
        </div>

    </div>
                
        </div>
